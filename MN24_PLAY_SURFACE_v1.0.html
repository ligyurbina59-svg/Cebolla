<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#020617">
<title>MN24 Play Surface</title>
<style>
:root{--bg:#020617;--p:#0f172a;--line:#1e293b;--c:#38bdf8;--g:#34d399;--t:#e2e8f0;--m:#64748b;--w:#fbbf24;--r:#f87171;--gold:#fbbf24}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--t);font:13px/1.4 system-ui,sans-serif;overflow:hidden}
.app{display:flex;flex-direction:column;height:100%;max-width:900px;margin:0 auto}
.hdr{padding:10px 14px;background:linear-gradient(165deg,#1e3a8a,#020617 80%);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand{font-weight:900;letter-spacing:1px}.brand span{color:var(--g)}.brand em{color:var(--c);font-style:normal}
.modes{display:flex;gap:4px}
.modes button{padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:#0f172a;color:var(--m);font-size:11px;font-weight:700}
.modes button.on{border-color:var(--g);color:var(--g);background:#052e16}
main{flex:1;overflow-y:auto;padding:12px;-webkit-overflow-scrolling:touch}
.panel{background:var(--p);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
h1{margin:0 0 6px;font-size:18px}h2{margin:0 0 8px;font-size:14px;color:var(--c)}
.muted{color:var(--m);font-size:11px;line-height:1.45}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.card{background:#020617;border:1px solid var(--line);border-radius:12px;padding:14px 10px;text-align:center;cursor:pointer}
.card:active,.card:focus{border-color:var(--c);outline:2px solid var(--c)}
.card strong{display:block;font-size:13px}.card .sub{font-size:10px;color:var(--m);margin-top:4px}
button.btn{width:100%;padding:12px;border:0;border-radius:10px;font-weight:800;margin:4px 0;background:linear-gradient(135deg,#34d399,#3b82f6);color:#031016}
button.btn.sec{background:#1e293b;color:var(--t);border:1px solid var(--line);font-weight:600}
button.btn.tv{padding:18px;font-size:16px}
.row{display:flex;gap:8px}.row .btn{flex:1}
.watch{max-width:280px;margin:0 auto;aspect-ratio:1;border-radius:50%;border:6px solid #334155;background:#0f172a;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;box-shadow:0 0 0 4px #020617,0 0 40px #0008}
.watch .time{font-size:28px;font-weight:900;color:var(--g)}
.watch .hp{font-size:12px;color:var(--m);margin:6px 0 12px}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.wgrid button{padding:14px 8px;border-radius:12px;border:1px solid var(--line);background:#020617;color:var(--t);font-weight:800;font-size:12px}
.wgrid button:active{border-color:var(--g);background:#052e16}
.hpbar{height:10px;background:#1e293b;border-radius:6px;overflow:hidden;margin:8px 0}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#dc2626,#f87171);width:100%}
.story{font-size:13px;line-height:1.5;margin:8px 0}
.log{font-size:11px;background:#020617;border:1px solid var(--line);border-radius:10px;padding:10px;max-height:100px;overflow:auto;white-space:pre-wrap;color:#94a3b8}
.tag{font-size:9px;padding:2px 8px;border-radius:6px;border:1px solid var(--line);color:var(--m)}
.tag.ok{border-color:var(--g);color:var(--g)}.tag.sim{border-color:var(--w);color:var(--w)}
.item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:12px}
footer{font-size:9px;text-align:center;color:var(--m);padding:6px;border-top:1px solid var(--line)}
/* TV 10-foot */
body.tv .card,body.tv .btn{padding:20px;font-size:18px}
body.tv .brand{font-size:18px}
body.tv main{padding:20px}
body.watch-mode main{padding:8px}
body.watch-mode .hdr .modes{display:none}
</style>
</head>
<body>
<div class="app">
  <div class="hdr">
    <div class="brand"><span>MN24</span> <em>PLAY</em></div>
    <div class="modes" id="modes">
      <button data-m="phone" class="on">Phone</button>
      <button data-m="tv">TV</button>
      <button data-m="watch">Watch</button>
    </div>
  </div>
  <main id="main"></main>
  <footer>MN24 Play Surface · Phone · TV · Watch · sideload / HTML</footer>
</div>
<script>
const KEY='mn24_play_surface_v1';
const ST={mode:'phone', screen:'home', hp:100, hpMax:100, loc:'fjord', gold:10, log:[], battle:null};
const LOCS={
  fjord:{n:'Fiordo Negro',d:'El viento del norte. La saga empieza.',ex:['village','cave']},
  village:{n:'Aldea de Ceniza',d:'Hogares fríos. Rumores del trono vacío.',ex:['fjord','forest']},
  cave:{n:'Cueva del Lobo',d:'Ojos en la oscuridad.',ex:['fjord'], enemy:1},
  forest:{n:'Bosque de Sangre',d:'Senderos hacia el trono.',ex:['village','gate']},
  gate:{n:'Puerta del Trono',d:'Dos estatuas: espada y cadena.',ex:['forest','throne'], enemy:1},
  throne:{n:'Trono Vacío',d:'Siéntate o rómpelo. Redención es elección.',ex:['gate'], final:1}
};
function load(){try{Object.assign(ST,JSON.parse(localStorage.getItem(KEY)||'{}'));}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify({mode:ST.mode,hp:ST.hp,loc:ST.loc,gold:ST.gold,log:ST.log.slice(-30)}));}catch(e){}}
function push(m){ST.log.push(m);if(ST.log.length>40)ST.log.shift();}
const $=id=>document.getElementById(id);
const el=(t,c,x)=>{const n=document.createElement(t);if(c)n.className=c;if(x!=null)n.textContent=x;return n;};
function setMode(m){
  ST.mode=m;
  document.body.classList.toggle('tv',m==='tv');
  document.body.classList.toggle('watch-mode',m==='watch');
  [...$('modes').children].forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  save(); render();
}
function hudHp(){return Math.max(0,Math.round(100*ST.hp/ST.hpMax));}

function renderWatch(){
  const m=$('main'); m.innerHTML='';
  const w=el('div','watch');
  w.innerHTML='<div class="time" id="wt">--:--</div><div class="hp">HP '+ST.hp+' · '+ (LOCS[ST.loc]?LOCS[ST.loc].n:'') +'</div>';
  const g=el('div','wgrid');
  [['⚔','Atacar'],['🗺','Mapa'],['📷','Foto'],['❤','Curar']].forEach(([i,l],idx)=>{
    const b=document.createElement('button'); b.innerHTML=i+'<br>'+l;
    b.onclick=()=>{
      if(idx===0){ST.hp=Math.max(1,ST.hp-8);push('Watch: ataque simulado');}
      if(idx===1){ST.screen='game';setMode('phone');return;}
      if(idx===2){push('Watch: remoto cámara (UI)');alert('Remoto cámara: usa la app del reloj (Fotos / Demora / 1p) con el teléfono.');}
      if(idx===3){ST.hp=Math.min(ST.hpMax,ST.hp+15);push('Watch: curar');}
      save(); render();
    };
    g.appendChild(b);
  });
  w.appendChild(g); m.appendChild(w);
  const tick=()=>{const c=$('wt');if(c)c.textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});};
  tick(); if(window._wt)clearInterval(window._wt); window._wt=setInterval(tick,1000);
}

function render(){
  if(ST.mode==='watch'){renderWatch();return;}
  const tv=ST.mode==='tv';
  const m=$('main'); m.innerHTML='';
  const btnCls=tv?'btn tv':'btn';

  if(ST.screen==='home'){
    const p=el('div','panel');
    p.appendChild(el('h1',null,'MN24 Play Surface'));
    p.appendChild(el('p','muted','Un núcleo de juego para teléfono, Smart TV (mando) y smartwatch (companion). No es un AAA del mercado mundial.'));
    const g=el('div',tv?'grid':'grid');
    [['🎮 Juego Nordic','game'],['📺 Guía TV','tvhelp'],['⌚ Guía Watch','watchhelp'],['📦 Publicar','publish'],['💾 Estado','status']].forEach(([n,s])=>{
      const c=el('div','card'); c.innerHTML='<strong>'+n+'</strong><div class="sub">abrir</div>';
      c.tabIndex=0; c.onclick=()=>{ST.screen=s;render();};
      g.appendChild(c);
    });
    p.appendChild(g); m.appendChild(p); return;
  }

  if(ST.screen==='tvhelp'){
    const p=el('div','panel');
    p.appendChild(el('h2',null,'Smart TV'));
    p.appendChild(el('p','story','1. Abre el HTML en el navegador del TV o instala el APK en Android TV.\n2. Usa el modo TV (botón arriba).\n3. Navega con D-pad / flechas y OK.\n4. El juego completo se juega mejor en teléfono; el TV sirve para menú grande y co-op local de lectura.'));
    const b=el('button',btnCls+' sec','Volver'); b.onclick=()=>{ST.screen='home';render();}; p.appendChild(b);
    m.appendChild(p); return;
  }

  if(ST.screen==='watchhelp'){
    const p=el('div','panel');
    p.appendChild(el('h2',null,'Smartwatch'));
    p.appendChild(el('p','story','Modo Watch: 4 acciones (Atacar, Mapa, Foto, Curar). La cámara del reloj (Fotos / Demora / 1p) es el companion del fabricante; esta app solo refleja control de juego.'));
    const b=el('button',btnCls,'Probar modo Watch'); b.onclick=()=>setMode('watch');
    const b2=el('button',btnCls+' sec','Volver'); b2.onclick=()=>{ST.screen='home';render();};
    p.appendChild(b); p.appendChild(b2); m.appendChild(p); return;
  }

  if(ST.screen==='publish'){
    const p=el('div','panel');
    p.appendChild(el('h2',null,'Copiar y publicar'));
    p.appendChild(el('p','story','APK Android: sideload (USB, Drive, telegram) o Play Store (cuenta desarrollador, firma, política).\n\nCD/DVD: un CD no instala APKs en móviles modernos. Puedes grabar el .apk + .html + README en un USB o disc para archivo, no como tienda.\n\nSmart TV: Android TV sideload o HTML en navegador.\n\nWatch: no se publica un “juego completo” en Wear OS desde este WebView; se publica companion / control.'));
    const steps=el('div','log');
    steps.textContent='1. Firma el APK (ya debug-signed en este build).\n2. Copia NORDIC / PLAY SURFACE a USB o carpeta.\n3. En el teléfono: permitir orígenes desconocidos → instalar.\n4. Play Store: consola Play, AAB, privacidad, contenido.\n5. No afirmes “competir con el mercado AAA”.';
    p.appendChild(steps);
    const b=el('button',btnCls+' sec','Volver'); b.onclick=()=>{ST.screen='home';render();}; p.appendChild(b);
    m.appendChild(p); return;
  }

  if(ST.screen==='status'){
    const p=el('div','panel');
    p.appendChild(el('h2',null,'Estado honesto'));
    [['Juego local Phone','ok'],['Layout TV 10-foot','ok'],['Watch companion UI','ok'],['Remoto cámara OEM','sim'],['Publicación Play Store','sim'],['AAA / 5D mercado','— no']].forEach(([a,k])=>{
      const i=el('div','item'); i.appendChild(el('strong',null,a));
      i.appendChild(el('span','tag '+(k==='ok'?'ok':k==='sim'?'sim':''),k)); p.appendChild(i);
    });
    const b=el('button',btnCls+' sec','Volver'); b.onclick=()=>{ST.screen='home';render();}; p.appendChild(b);
    m.appendChild(p); return;
  }

  // GAME
  const loc=LOCS[ST.loc]||LOCS.fjord;
  const p=el('div','panel');
  p.appendChild(el('h2',null,loc.n));
  const bar=el('div','hpbar'); bar.innerHTML='<i style="width:'+hudHp()+'%"></i>'; p.appendChild(bar);
  p.appendChild(el('p','muted','HP '+ST.hp+' · Oro '+ST.gold));
  p.appendChild(el('p','story',loc.d));
  if(loc.final){
    const sit=el('button',btnCls,'Sentar en el trono');
    const brk=el('button',btnCls+' sec','Destrozar el trono');
    sit.onclick=()=>{push('Final: trono');alert('Redención: gobernar.');ST.screen='home';save();render();};
    brk.onclick=()=>{push('Final: romper');alert('El norte es viento otra vez.');ST.screen='home';save();render();};
    p.appendChild(sit); p.appendChild(brk);
  }
  const g=el('div','grid');
  (loc.ex||[]).forEach(id=>{
    const L=LOCS[id]; if(!L)return;
    const c=el('div','card'); c.tabIndex=0;
    c.innerHTML='<strong>'+L.n+'</strong><div class="sub">viajar</div>';
    c.onclick=()=>{
      ST.loc=id; push('→ '+L.n);
      if(L.enemy && Math.random()>0.45){
        const dmg=8+Math.floor(Math.random()*12);
        ST.hp=Math.max(0,ST.hp-dmg); ST.gold+=3;
        push('Combate -'+dmg+' HP');
        if(ST.hp<=0){ST.hp=30;push('Derrota · reanimación débil');}
      }
      save(); render();
    };
    g.appendChild(c);
  });
  p.appendChild(g);
  const row=el('div','row');
  const rest=el('button',btnCls+' sec','Descansar'); rest.onclick=()=>{ST.hp=Math.min(ST.hpMax,ST.hp+20);push('Descanso');save();render();};
  const home=el('button',btnCls+' sec','Menú'); home.onclick=()=>{ST.screen='home';render();};
  row.appendChild(rest); row.appendChild(home); p.appendChild(row);
  p.appendChild(el('div','log')).textContent=ST.log.slice(-6).join('\n')||'…';
  m.appendChild(p);
}

$('modes').onclick=e=>{const b=e.target.closest('[data-m]');if(b)setMode(b.dataset.m);};
load();
if(['phone','tv','watch'].indexOf(ST.mode)<0)ST.mode='phone';
setMode(ST.mode);
</script>
</body>
</html>
